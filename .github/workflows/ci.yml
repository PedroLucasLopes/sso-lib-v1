# Integracao continua do sso-lib-v1: auditoria das dependencias, lint,
# compilacao e o conteudo do pacote, em pull request e em push na main. A entrega
# e o `publish.yml`, que publica no GitHub Packages quando chega uma tag v*.
#
# O teste da biblioteca de verdade e o ponta a ponta do krloc-api-v1, que sobe a
# API com ela contra um SSO de pe.
#
# O pipeline tambem e superficie de ataque: cada action e fixada por commit, e
# nao por tag, que pode ser movida; o token tem so leitura; e o checkout nao
# deixa credencial no disco para os passos seguintes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Auditoria, lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar
        run: npm ci

      # O que vai para as APIs nao passa com aviso nenhum; o resto, sem alto.
      - name: Auditar dependencias de producao
        run: npm audit --omit=dev --audit-level=moderate

      - name: Auditar todas as dependencias
        run: npm audit --audit-level=high

      - run: npm run lint:check

      - run: npm run build

      # O que o pacote leva: so `dist`, sem fonte, teste nem configuracao.
      - name: Conferir o conteudo do pacote
        run: npm pack --dry-run

  nest12:
    name: Pacote num app Nest 12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/nest12/package-lock.json

      - name: Instalar
        run: npm ci

      - run: npm run build

      - name: Empacotar
        run: npm pack --pack-destination test/nest12

      - name: Instalar o pacote no app de teste
        working-directory: test/nest12
        run: |
          npm ci
          npm install --no-save ./pedrolucaslopes-sso-client-*.tgz
          npm ls @nestjs/common @nestjs/core @nestjs/platform-express @nestjs/config @pedrolucaslopes/sso-client typescript

      - name: Conferir os tipos com o TypeScript 6
        working-directory: test/nest12
        run: npm run build

      - name: Subir o app e rodar o smoke
        working-directory: test/nest12
        run: npm run smoke
